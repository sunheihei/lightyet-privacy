<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Policy - LightYet</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #046b5e;
      --primary-dark: #035048;
      --primary-light: #ecfdf5;
      --accent: #0d9488;
      --text: #1a2e24;
      --muted: #4b7165;
      --border: #d1fae5;
      --bg: #f4fefa;
      --white: #ffffff;
      --shadow: rgba(4, 107, 94, 0.10);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      font-size: 16px;
    }

    header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--accent) 100%);
      color: #fff;
      padding: 28px 24px 48px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 70% 20%, rgba(255,255,255,0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .header-top {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 24px;
    }

    .lang-switcher {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 8px;
      border-radius: 16px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.18);
    }

    .lang-switcher button {
      border: 0;
      border-radius: 999px;
      padding: 8px 12px;
      background: transparent;
      color: rgba(255,255,255,0.84);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .lang-switcher button:hover,
    .lang-switcher button:focus-visible {
      background: rgba(255,255,255,0.16);
      color: #fff;
      outline: none;
    }

    .lang-switcher button.active {
      background: #fff;
      color: var(--primary-dark);
      box-shadow: 0 6px 18px rgba(0,0,0,0.14);
    }

    .logo-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .app-icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.22), 0 2px 8px rgba(0,0,0,0.12);
      overflow: hidden;
      flex-shrink: 0;
    }

    .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 22px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .tagline {
      margin-top: 8px;
      font-size: 1.05rem;
      opacity: 0.9;
      font-weight: 400;
    }

    .meta-row {
      position: relative;
      z-index: 1;
      margin-top: 22px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(4px);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 500;
      opacity: 0.94;
      border: 1px solid rgba(255,255,255,0.18);
    }

    .translation-note {
      position: relative;
      z-index: 1;
      margin: 18px auto 0;
      max-width: 820px;
      font-size: 0.86rem;
      line-height: 1.7;
      color: rgba(255,255,255,0.92);
      opacity: 0.95;
    }

    .toc-nav {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px var(--shadow);
    }

    .toc-nav ul {
      display: inline-flex;
      padding: 0 20px;
      gap: 0;
      list-style: none;
    }

    .toc-nav li {
      padding: 0;
      color: inherit;
    }

    .toc-nav li::before {
      content: none;
    }

    .toc-nav a {
      display: block;
      padding: 13px 15px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      transition: color 0.18s ease, border-color 0.18s ease;
    }

    .toc-nav a:hover {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 52px 24px 100px;
    }

    .intro-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 32px;
      margin-bottom: 48px;
      font-size: 0.97rem;
      color: var(--muted);
      box-shadow: 0 2px 12px var(--shadow);
      position: relative;
    }

    .intro-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(to bottom, var(--primary), var(--accent));
      border-radius: 4px 0 0 4px;
    }

    .intro-card strong { color: var(--primary); }

    .tldr-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .tldr-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-light);
      border: 1px solid var(--border);
      color: var(--primary);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
    }

    section {
      margin-bottom: 52px;
      scroll-margin-top: 58px;
    }

    section h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .sec-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: var(--primary);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      border-radius: 50%;
      flex-shrink: 0;
    }

    p { margin-bottom: 14px; }
    p:last-child { margin-bottom: 0; }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      padding: 7px 0 7px 26px;
      position: relative;
      color: #2d4a42;
    }

    li::before {
      content: "->";
      position: absolute;
      left: 0;
      color: var(--accent);
      font-weight: 700;
    }

    .highlight {
      background: var(--white);
      border-left: 4px solid var(--primary);
      border-radius: 0 12px 12px 0;
      padding: 14px 20px;
      margin: 18px 0;
      font-size: 0.92rem;
      color: var(--muted);
      box-shadow: 0 1px 6px var(--shadow);
    }

    .highlight strong { color: var(--text); }

    .info-box {
      background: var(--primary-light);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin: 18px 0;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .info-box strong { color: var(--primary); }

    .warn-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 14px 20px;
      margin: 18px 0;
      font-size: 0.92rem;
      color: #78350f;
    }

    .badge {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      vertical-align: middle;
      margin-left: 6px;
      letter-spacing: 0.4px;
    }

    .badge-gold {
      background: linear-gradient(90deg, #d97706, #b45309);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      margin: 18px 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 6px var(--shadow);
    }

    .data-table th {
      background: var(--primary);
      color: #fff;
      text-align: left;
      padding: 11px 15px;
      font-weight: 600;
    }

    .data-table td {
      padding: 10px 15px;
      border-bottom: 1px solid var(--border);
      color: #2d4a42;
      vertical-align: top;
    }

    .data-table tr:nth-child(even) td { background: var(--primary-light); }
    .data-table tr:last-child td { border-bottom: none; }

    .yes { color: #059669; font-weight: 700; }
    .no { color: #9ca3af; }
    .cond { color: #d97706; font-weight: 600; }

    .plan-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin: 20px 0;
    }

    .plan-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: 0 2px 8px var(--shadow);
    }

    .plan-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .plan-desc {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .plan-card.featured {
      border-color: var(--accent);
      box-shadow: 0 4px 16px rgba(13,148,136,0.15);
    }

    .contact-card {
      background: linear-gradient(135deg, var(--white), var(--primary-light));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 4px 16px var(--shadow);
    }

    .icon-circle {
      width: 56px;
      height: 56px;
      background: var(--primary);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 16px;
    }

    .contact-card a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
      font-size: 1.05rem;
    }

    .contact-card a:hover { text-decoration: underline; }

    .response-time {
      display: inline-block;
      margin-top: 12px;
      background: var(--primary-light);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.78rem;
      color: var(--primary);
      font-weight: 600;
    }

    footer {
      text-align: center;
      padding: 32px 16px;
      color: var(--muted);
      font-size: 0.82rem;
      border-top: 1px solid var(--border);
    }

    code.inline-code {
      font-size: 0.85em;
      background: var(--primary-light);
      padding: 1px 5px;
      border-radius: 4px;
    }

    @media (max-width: 640px) {
      header { padding: 20px 16px 40px; }
      .header-top { justify-content: center; margin-bottom: 18px; }
      header h1 { font-size: 1.6rem; }
      .app-icon { width: 76px; height: 76px; border-radius: 18px; }
      main { padding: 32px 16px 60px; }
      .data-table { font-size: 0.80rem; display: block; overflow-x: auto; }
      .plan-grid { grid-template-columns: 1fr; }
      .toc-nav a { padding: 12px 10px; font-size: 0.73rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div class="lang-switcher" id="langSwitcher" aria-label="Language switcher">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="ja">日本語</button>
        <button type="button" data-lang="es">ES</button>
        <button type="button" data-lang="fr">FR</button>
        <button type="button" data-lang="de">DE</button>
      </div>
    </div>
    <div class="logo-wrap">
      <div class="app-icon">
        <img src="logo2.png" alt="LightYet App Icon" />
      </div>
      <h1 id="appTitle">LightYet</h1>
      <p class="tagline" id="tagline"></p>
    </div>
    <div class="meta-row" id="metaRow"></div>
    <p class="translation-note" id="translationNote"></p>
  </header>

  <nav class="toc-nav" id="tocNav" aria-label="Table of contents">
    <ul id="tocList"></ul>
  </nav>

  <main id="mainContent"></main>

  <footer id="footerContent"></footer>

  <script>
    const translations = {
      en: {
        pageTitle: "Privacy Policy - LightYet",
        tagline: "Privacy Policy - Your health data stays with you.",
        translationNote: "Translations are provided for convenience. If any translated version conflicts with the English text, the English version prevails.",
        meta: [
          "Last updated: May 18, 2026",
          "Applies to: LightYet for iOS",
          "Effective immediately"
        ],
        intro: {
          paragraphs: [
            "<strong>LightYet</strong> is a personal weight and body-composition tracker built with one guiding principle: <strong>your health data belongs to you alone</strong>. We have no backend servers, we collect no analytics, and we cannot access data stored on your device or in your personal iCloud account. This policy explains exactly what data the app handles, where it lives, and how it is protected."
          ],
          chips: [
            "No ads or tracking",
            "No third-party SDKs",
            "Data stays on your device",
            "Apple Health only with permission",
            "iCloud is your own account",
            "Apple processes all payments"
          ]
        },
        sections: [
          {
            id: "s1",
            toc: "Who We Are",
            title: "Who We Are",
            blocks: [
              {
                type: "p",
                html: "LightYet is an independently developed iOS application. The developer can be reached at the email address in the <a href='#s15' style='color:var(--primary);font-weight:600'>Contact</a> section. There is no company, organization, or team behind this app beyond a single independent developer."
              },
              {
                type: "info",
                html: "Because we operate without a backend infrastructure, we have no access to any data you store in the app. All data lives on your own devices and your own iCloud account."
              }
            ]
          },
          {
            id: "s2",
            toc: "Data We Collect",
            title: "Data We Collect",
            blocks: [
              {
                type: "p",
                html: "LightYet collects <strong>only data you explicitly enter or choose to import after granting permission</strong>. No data is collected passively, automatically, or in the background."
              },
              {
                type: "table",
                headers: ["Data Type", "Purpose", "Local Storage", "iCloud Sync"],
                rows: [
                  ["<strong>Body weight records</strong>", "Core tracking, trends & charts", "<span class='yes'>Yes</span>", "<span class='cond'>Pro only <span class='badge'>PRO</span></span>"],
                  ["<strong>Body fat percentage</strong>", "Body composition analysis", "<span class='yes'>Yes</span>", "<span class='cond'>Pro only <span class='badge'>PRO</span></span>"],
                  ["<strong>Record date & note</strong>", "Logging context & history", "<span class='yes'>Yes</span>", "<span class='cond'>Pro only <span class='badge'>PRO</span></span>"],
                  ["<strong>Name, gender, age, height</strong>", "BMI calculation & personalization", "<span class='yes'>Yes</span>", "<span class='yes'>All users (KV Store)</span>"],
                  ["<strong>Goal weight</strong>", "Progress tracking", "<span class='yes'>Yes</span>", "<span class='yes'>All users (KV Store)</span>"],
                  ["<strong>App preferences</strong> (unit, theme, avatar)", "UI personalization", "<span class='yes'>Yes</span>", "<span class='yes'>All users (KV Store)</span>"],
                  ["<strong>Multiple user profiles</strong>", "Family / multi-user tracking", "<span class='yes'>Yes</span>", "<span class='yes'>All users (KV Store)</span>"],
                  ["<strong>Notification schedule</strong>", "Daily reminder timing", "<span class='yes'>Device only</span>", "<span class='no'>Not synced</span>"],
                  ["<strong>Widget display data</strong>", "Home screen weight widget", "<span class='yes'>App Group only</span>", "<span class='no'>Not synced</span>"],
                  ["<strong>Apple Health data</strong> (weight, body fat, height)", "Optional import, profile height update, and optional write-back", "<span class='cond'>Only after you grant permission</span>", "<span class='cond'>Imported records may sync if Pro iCloud Sync is enabled</span>"]
                ]
              },
              {
                type: "highlight",
                html: "<strong>We do not collect:</strong> device identifiers, IP addresses, precise or approximate location, camera or photos, contacts, advertising IDs, crash logs, usage analytics, or any form of telemetry. <strong>Apple Health data is accessed only if you explicitly grant Health permission and use the Apple Health sync feature.</strong>"
              }
            ]
          },
          {
            id: "s3",
            toc: "How We Use It",
            title: "How We Use Your Data",
            blocks: [
              {
                type: "p",
                html: "All data you enter is used <strong>exclusively</strong> to power app features you directly interact with:"
              },
              {
                type: "ul",
                items: [
                  "Displaying your weight history, trends, and progress charts",
                  "Calculating BMI, ideal weight range, and body fat classification",
                  "Tracking streak achievements, check-in milestones, and weight-loss goals",
                  "Personalizing the app interface (themes, units, avatars)",
                  "Populating the home screen and lock screen weight widget",
                  "Sending local reminder notifications, only if you enable them",
                  "Generating shareable achievement cards entirely on-device",
                  "Importing or writing Apple Health weight and body fat data only after your permission"
                ]
              },
              {
                type: "p",
                html: "We do <strong>not</strong> use your data for advertising, behavioral profiling, machine learning training, or any purpose beyond delivering the features described above."
              }
            ]
          },
          {
            id: "s4",
            toc: "Data Storage",
            title: "Where Your Data Lives",
            blocks: [
              { type: "p", html: "<strong>Layer 1 - Local device storage (all users)</strong>" },
              { type: "p", html: "Weight records, body composition entries, and user profiles are stored on your device using Apple's <strong>SwiftData</strong> framework. This data does not leave your device unless you are a Pro member with iCloud sync enabled." },
              { type: "p", html: "<strong>Layer 2 - iCloud CloudKit (Pro members only)</strong>" },
              { type: "highlight", html: "Pro members can sync weight records across their Apple devices via <strong>Apple CloudKit</strong>, Apple's private cloud infrastructure. Synced data resides in your <em>personal, private iCloud container</em>. Neither we nor any third party can read or access it. Apple's privacy policy governs this storage: <a href='https://www.apple.com/legal/privacy/' target='_blank' rel='noopener' style='color:var(--primary);font-weight:600'>apple.com/legal/privacy</a>. After a reinstall, data automatically restores from iCloud on first launch." },
              { type: "p", html: "<strong>Layer 3 - iCloud Key-Value Store (all users)</strong>" },
              { type: "p", html: "App preferences (weight unit, theme, goal weight, profile info) are synced via Apple's <code class='inline-code'>NSUbiquitousKeyValueStore</code> for all users. This is a small encrypted store in your iCloud account. Notification preferences are deliberately excluded and remain device-local only." },
              { type: "p", html: "<strong>Layer 4 - App Group shared container (widget)</strong>" },
              { type: "p", html: "A small snapshot of your latest weight entry is written to an App Group shared container so the iOS widget can display it without launching the main app. This data never leaves your device and contains only the values needed to render the widget." }
            ]
          },
          {
            id: "s5",
            toc: "Apple Health",
            title: "Apple Health",
            blocks: [
              { type: "p", html: "LightYet can optionally connect with <strong>Apple Health</strong> through Apple's HealthKit framework. This feature is entirely optional and is used only when you open Apple Health Sync and grant Health permission in iOS." },
              { type: "p", html: "<strong>Health data LightYet may read</strong>" },
              { type: "ul", items: [
                "<strong>Body mass:</strong> used to import existing Apple Health weight records into LightYet",
                "<strong>Body fat percentage:</strong> used to import matching body fat records into LightYet",
                "<strong>Height:</strong> used only when you choose to update your LightYet profile height from Apple Health"
              ]},
              { type: "p", html: "<strong>Health data LightYet may write</strong>" },
              { type: "ul", items: [
                "<strong>Body mass:</strong> new LightYet weight records can be saved to Apple Health only when you enable Apple Health writing",
                "<strong>Body fat percentage:</strong> body fat values can be saved to Apple Health together with your weight record when present"
              ]},
              { type: "highlight", html: "<strong>HealthKit privacy:</strong> Apple Health access is permission-based and controlled by iOS. LightYet does not use Apple Health data for advertising, tracking, marketing, behavioral profiling, or machine learning training. Apple Health data is not shared with third parties." },
              { type: "p", html: "If you import Apple Health records into LightYet, those imported records become LightYet records and follow the same local storage and optional iCloud sync behavior described in this policy. If you enable Apple Health writing, only new LightYet weight and body fat records are written back to Apple Health." },
              { type: "p", html: "You can revoke Apple Health permissions at any time in <em>iOS Settings -> Health -> Data Access & Devices -> LightYet</em>. You can also review or delete records written to Apple Health in the Health app." }
            ]
          },
          {
            id: "s6",
            toc: "Subscriptions",
            title: "Subscriptions & In-App Purchases",
            blocks: [
              { type: "p", html: "LightYet offers a <strong>Pro</strong> upgrade via Apple's In-App Purchase system, available in three plans:" },
              { type: "plans", plans: [
                { name: "Monthly", desc: "Auto-renewing monthly subscription. Cancel anytime through the App Store." },
                { name: "Yearly <span class='badge badge-gold'>Best Value</span>", desc: "Auto-renewing annual subscription. Cancel anytime through the App Store.", featured: true },
                { name: "Lifetime", desc: "One-time non-consumable purchase. Permanent Pro access with no recurring charge." }
              ]},
              { type: "highlight", html: "<strong>Payment privacy:</strong> All purchase transactions are processed entirely by <strong>Apple's App Store</strong>. We never see, receive, or store your payment card number, billing address, or any financial information. Apple's <a href='https://www.apple.com/legal/privacy/' target='_blank' rel='noopener' style='color:var(--primary);font-weight:600'>privacy policy</a> governs all payment processing." },
              { type: "p", html: "<strong>Subscription management & cancellation</strong>" },
              { type: "ul", items: [
                "Manage or cancel subscriptions: <em>App Store -> Your Name -> Subscriptions</em>",
                "Monthly and yearly subscriptions auto-renew unless cancelled at least 24 hours before the renewal date",
                "Cancelling stops future renewals; Pro features remain active until the end of the current billing period",
                "Lifetime purchases are permanent and non-refundable except under Apple's standard refund policy"
              ]},
              { type: "info", html: "<strong>Subscription receipt validation</strong> is performed entirely on-device via Apple's StoreKit framework. We do not operate a receipt validation server." }
            ]
          },
          {
            id: "s7",
            toc: "Third Parties",
            title: "Third-Party Services & SDKs",
            blocks: [
              { type: "p", html: "LightYet uses <strong>no third-party analytics, advertising, crash reporting, or tracking SDKs</strong>." },
              { type: "table", headers: ["Service", "Used?", "Reason"], rows: [
                ["Firebase / Crashlytics", "<span class='no'>No</span>", "-"],
                ["Facebook / Meta SDK", "<span class='no'>No</span>", "-"],
                ["Google Analytics / Firebase Analytics", "<span class='no'>No</span>", "-"],
                ["Adjust / AppsFlyer / Branch", "<span class='no'>No</span>", "-"],

    const languageOrder = ["en", "zh", "ja", "es", "fr", "de"];

    function buildIntro(intro) {
      const paragraphs = intro.paragraphs.map((paragraph) => `<p>${paragraph}</p>`).join("");
      const chips = intro.chips.map((chip) => `<span class="tldr-chip">✓ ${chip}</span>`).join("");
      return `
        <div class="intro-card">
          ${paragraphs}
          <div class="tldr-row">${chips}</div>
        </div>
      `;
    }

    function buildTable(block) {
      const head = block.headers.map((header) => `<th>${header}</th>`).join("");
      const rows = block.rows.map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join("")}</tr>`).join("");
      return `<table class="data-table"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
    }

    function buildList(items) {
      return `<ul>${items.map((item) => `<li>${item}</li>`).join("")}</ul>`;
    }

    function buildPlans(plans) {
      return `
        <div class="plan-grid">
          ${plans.map((plan) => `
            <div class="plan-card${plan.featured ? " featured" : ""}">
              <div class="plan-name">${plan.name}</div>
              <div class="plan-desc">${plan.desc}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function buildContact(block) {
      return `
        <div class="contact-card">
          <div class="icon-circle">✉️</div>
          <p style="font-size:1.08rem;font-weight:700;margin-bottom:10px;color:var(--text)">${block.heading}</p>
          <p style="color:#4b7165;margin-bottom:20px;font-size:0.95rem">${block.text}</p>
          <a href="mailto:${block.email}">${block.email}</a>
          <br />
          <span class="response-time">${block.response}</span>
        </div>
      `;
    }

    function buildBlock(block) {
      if (block.type === "p") return `<p>${block.html}</p>`;
      if (block.type === "ul") return buildList(block.items);
      if (block.type === "info") return `<div class="info-box">${block.html}</div>`;
      if (block.type === "highlight") return `<div class="highlight">${block.html}</div>`;
      if (block.type === "warn") return `<div class="warn-box">${block.html}</div>`;
      if (block.type === "table") return buildTable(block);
      if (block.type === "plans") return buildPlans(block.plans);
      if (block.type === "contact") return buildContact(block);
      return "";
    }

    function renderLanguage(lang) {
      const copy = translations[lang] || translations.en;
      document.documentElement.lang = lang;
      document.title = copy.pageTitle;
      document.getElementById("tagline").textContent = copy.tagline;
      document.getElementById("translationNote").textContent = copy.translationNote;
      document.getElementById("metaRow").innerHTML = copy.meta.map((item, index) => {
        const icon = ["📅", "📱", "🌍"][index] || "•";
        return `<span class="meta-pill">${icon} ${item}</span>`;
      }).join("");

      document.getElementById("tocNav").setAttribute("aria-label", copy.pageTitle);
      document.getElementById("tocList").innerHTML = copy.sections.map((section) => {
        return `<li><a href="#${section.id}">${section.toc}</a></li>`;
      }).join("");

      const sections = copy.sections.map((section, index) => {
        return `
          <section id="${section.id}">
            <h2><span class="sec-num">${index + 1}</span>${section.title}</h2>
            ${section.blocks.map(buildBlock).join("")}
          </section>
        `;
      }).join("");

      document.getElementById("mainContent").innerHTML = `${buildIntro(copy.intro)}${sections}`;
      document.getElementById("footerContent").innerHTML = copy.footer.map((line, index) => {
        const style = index === 0 ? "" : " style='margin-top:6px'";
        return `<p${style}>${line}</p>`;
      }).join("");

      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.classList.toggle("active", button.dataset.lang === lang);
      });

      localStorage.setItem("lightyet_privacy_lang", lang);
    }

    function detectInitialLanguage() {
      const saved = localStorage.getItem("lightyet_privacy_lang");
      if (saved && translations[saved]) return saved;

      const browserLang = (navigator.language || "en").toLowerCase();
      if (browserLang.startsWith("zh")) return "zh";
      if (browserLang.startsWith("ja")) return "ja";
      if (browserLang.startsWith("es")) return "es";
      if (browserLang.startsWith("fr")) return "fr";
      if (browserLang.startsWith("de")) return "de";
      return "en";
    }

    document.getElementById("langSwitcher").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-lang]");
      if (!button) return;
      renderLanguage(button.dataset.lang);
    });

    renderLanguage(detectInitialLanguage());
  </script>
