<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Privacy Policy for the LightYet iOS app.">
  <title>Privacy Policy - LightYet</title>
  <style>
    :root {
      --bg: #f4fbf8;
      --card: #ffffff;
      --text: #17251f;
      --muted: #587067;
      --primary: #087b69;
      --primary-dark: #045d50;
      --soft: #e2f5ee;
      --border: #cae6dc;
      --warning: #fff6dd;
      --warning-border: #ead69a;
      --shadow: 0 18px 55px rgba(4, 93, 80, 0.09);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--bg); }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 85% 5%, rgba(8, 123, 105, 0.12), transparent 30rem),
        var(--bg);
      font-size: 16px;
      line-height: 1.72;
    }

    a { color: var(--primary-dark); font-weight: 650; }

    header {
      color: white;
      background: linear-gradient(135deg, #034c43, #0a8a74);
      padding: 24px 24px 54px;
    }

    .header-inner,
    main,
    footer {
      width: min(880px, calc(100% - 40px));
      margin: 0 auto;
    }

    .top-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 30px;
    }

    .language-switcher {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 5px;
      padding: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 15px;
      background: rgba(255,255,255,0.1);
    }

    .language-switcher button {
      border: 0;
      border-radius: 999px;
      padding: 7px 10px;
      color: rgba(255,255,255,0.82);
      background: transparent;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 750;
      cursor: pointer;
    }

    .language-switcher button.active {
      color: #034c43;
      background: white;
    }

    .eyebrow {
      margin: 0 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.78rem;
      font-weight: 750;
      opacity: 0.78;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.3rem, 8vw, 4.2rem);
      line-height: 1.05;
      letter-spacing: -0.045em;
    }

    .subtitle {
      max-width: 700px;
      margin: 18px 0 0;
      font-size: 1.08rem;
      color: rgba(255,255,255,0.88);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .pill {
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 999px;
      background: rgba(255,255,255,0.11);
      font-size: 0.82rem;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      overflow-x: auto;
      white-space: nowrap;
      background: color-mix(in srgb, var(--card) 94%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
    }

    nav div {
      width: min(920px, 100%);
      margin: 0 auto;
      padding: 0 18px;
    }

    nav a {
      display: inline-block;
      padding: 14px 12px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.86rem;
    }

    main { padding: 46px 0 76px; }

    .summary,
    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .summary {
      padding: 26px;
      margin-bottom: 24px;
      background: linear-gradient(145deg, var(--card), var(--soft));
    }

    section {
      padding: clamp(22px, 5vw, 34px);
      margin-top: 20px;
      scroll-margin-top: 72px;
    }

    h2 {
      margin: 0 0 15px;
      font-size: 1.45rem;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    h3 { margin: 24px 0 8px; font-size: 1.05rem; }
    p { margin: 11px 0; color: var(--muted); }
    strong { color: var(--text); }
    ul { margin: 12px 0; padding-left: 1.25rem; }
    li { margin: 8px 0; color: var(--muted); }

    .notice {
      margin: 18px 0;
      padding: 16px 18px;
      border: 1px solid var(--warning-border);
      border-radius: 15px;
      background: var(--warning);
      color: #58491c;
    }

    .notice p { color: inherit; margin: 6px 0 0; }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 18px 0;
    }

    .data-card {
      padding: 16px;
      border-radius: 15px;
      background: var(--soft);
      border: 1px solid var(--border);
    }

    .data-card strong { display: block; margin-bottom: 4px; }
    .data-card span { color: var(--muted); font-size: 0.92rem; }

    footer {
      padding: 0 0 48px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
    }

    @media (max-width: 650px) {
      header { padding: 16px 14px 44px; }
      .header-inner, main, footer { width: min(100% - 28px, 880px); }
      .top-row { margin-bottom: 28px; }
      .language-switcher { justify-content: center; }
      .data-grid { grid-template-columns: 1fr; }
      section, .summary { border-radius: 18px; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09120f;
        --card: #101c18;
        --text: #e7f3ee;
        --muted: #adc2ba;
        --primary: #67d5bd;
        --primary-dark: #86e6d0;
        --soft: #142a23;
        --border: #29483e;
        --warning: #302a17;
        --warning-border: #655626;
        --shadow: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="top-row">
        <div class="language-switcher" id="languageSwitcher" aria-label="Language">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="ko">한국어</button>
          <button type="button" data-lang="ja">日本語</button>
          <button type="button" data-lang="de">DE</button>
          <button type="button" data-lang="es">ES</button>
          <button type="button" data-lang="fr">FR</button>
        </div>
      </div>
      <p class="eyebrow">LightYet for iOS</p>
      <h1 id="pageTitle"></h1>
      <p class="subtitle" id="subtitle"></p>
      <div class="meta" id="meta"></div>
    </div>
  </header>

  <nav id="navigation" aria-label="Privacy Policy sections"><div id="navLinks"></div></nav>
  <main id="content"></main>
  <footer id="footer"></footer>

  <script>
    const sharedLinks = {
      cloudflare: "https://www.cloudflare.com/privacypolicy/",
      xiaomi: "https://privacy.mi.com/all/en_US/",
      apple: "https://www.apple.com/legal/privacy/"
    };

    const translations = {
      en: {
        title: "Privacy Policy",
        subtitle: "How LightYet handles weight-management data, photos, Apple Health data, optional iCloud sync, and information submitted to AI features.",
        meta: ["Effective: August 25, 2026", "Local-first", "AI sharing requires consent"],
        nav: ["Overview", "Information", "AI Processing", "Apple Services", "Storage", "Your Choices", "Contact"],
        summaryTitle: "Privacy at a glance",
        summary: "LightYet is a local-first weight-management app. Core records are stored on your device. Optional features may use Apple iCloud, Apple Health, local notifications, speech recognition, the camera, the photo library, StoreKit, and external AI processing.",
        cards: [
          ["No advertising or behavioral tracking", "The current app does not include third-party advertising or behavioral analytics SDKs."],
          ["AI is optional", "No AI request is sent until you grant AI Data Sharing consent."],
          ["Health access requires permission", "Apple Health data is read or written only after you grant the relevant iOS permission. Steps, sleep, active energy, and workout summaries remain on this device by default."],
          ["iCloud sync is optional", "Supported records sync through your Apple iCloud account only when enabled; sync is off by default."]
        ],
        sections: [
          {
            id: "information", title: "1. Information LightYet handles",
            html: `<p>The information handled depends on the features you choose. It may include:</p>
              <ul>
                <li>Weight, body-fat percentage, timestamps, notes, goals, and trend summaries.</li>
                <li>Nickname, age, sex selection, height, target weight, avatar, unit, and theme.</li>
                <li>Progress photos, thumbnails, pose labels, food records, meal photos, and calorie estimates.</li>
                <li>AI questions, answers, conversation history, important marks, and AI reports.</li>
                <li>Reminder preferences, purchase entitlement state, and Apple Health weight, body-fat, height, steps, sleep, active-energy, or workout-summary data when authorized.</li>
              </ul>
              <h3>Device and network information</h3>
              <p>Apple and AI services necessarily receive ordinary network information such as IP address, request time, and technical headers. LightYet does not use it for advertising profiles or cross-app tracking.</p>
              <p>The current app does not request contacts, precise location, payment-card details, or an advertising identifier. Apple handles payment details.</p>`
          },
          {
            id: "use", title: "2. How information is used",
            html: `<ul>
                <li>To create, display, search, export, import, and delete records.</li>
                <li>To calculate trends, achievements, calorie totals, summaries, and widgets.</li>
                <li>To store selected photos, schedule reminders, and provide Apple Health or iCloud features you enable.</li>
                <li>To verify Premium access through StoreKit.</li>
                <li>To provide an AI result you explicitly request after granting consent.</li>
              </ul>
              <p>LightYet does not use your information for behavioral advertising, data brokerage, or cross-app tracking.</p>`
          },
          {
            id: "ai", title: "3. AI Data Sharing and external processing",
            html: `<div class="notice"><strong>AI features are opt-in.</strong><p>Before any AI request is sent, LightYet displays an AI Data Sharing screen. You can decline and continue using non-AI features, or withdraw consent later in Settings.</p></div>
              <p>AI requests pass through the LightYet gateway on <strong>Cloudflare Workers</strong> and are forwarded to <strong>Xiaomi MiMo</strong>.</p>
              <h3>Data that may be sent</h3>
              <ul>
                <li><strong>Meal photo estimate:</strong> the compressed meal image you select, optional hint, locale, and calorie target.</li>
                <li><strong>Typed or spoken meal estimate:</strong> the meal description, locale, and calorie target.</li>
                <li><strong>AI Wellness Q&amp;A:</strong> your question, recent conversation context, and relevant age, sex selection, height, weight, body-fat, trend, and calorie context.</li>
                <li><strong>AI body review:</strong> relevant profile values, planning preferences, weight and body-fat trends, calorie summaries, and—when you request this report—steps, sleep-duration summaries, active-energy totals, and workout summaries from Apple Health.</li>
              </ul>
              <p>Progress photos are not included in body-review requests. Apple Health activity data is read temporarily for the requested review: LightYet does not save these raw values as app records or sync them through iCloud. A food photo is sent only when you actively choose it for AI meal estimation. AI results may be inaccurate and are not medical diagnosis, treatment, or emergency advice.</p>
              <h3>Withdrawal and providers</h3>
              <p>Turning off AI Data Sharing stops new AI transmissions. It does not automatically delete locally stored conversations or reports. Previously processed data may be retained by providers under their policies.</p>
              <ul>
                <li><a href="${sharedLinks.cloudflare}" target="_blank" rel="noopener noreferrer">Cloudflare Privacy Policy</a></li>
                <li><a href="${sharedLinks.xiaomi}" target="_blank" rel="noopener noreferrer">Xiaomi Privacy Policy</a></li>
              </ul>`
          },
          {
            id: "apple", title: "4. Apple services",
            html: `<h3>Apple Health</h3>
              <p>With your permission, LightYet may read weight and body-fat records, read height when you request a profile update, and write new weight or body-fat records when writing is enabled. For the activity and sleep features, this may include daily step totals, sleep-duration summaries, active-energy totals, and workout summaries. These four activity categories are optional, read only after the relevant iOS Health permission, and are not written back to Apple Health. HealthKit data is not used for advertising or tracking. Activity data remains on this device by default, is not saved as a LightYet record, and is not synced through iCloud. It may leave the device only when you grant AI Data Sharing and actively request an AI body review. Each device requires its own Apple Health authorization.</p>
              <h3>iCloud and other Apple services</h3>
              <p>When iCloud sync is enabled, supported records and progress-photo display images or thumbnails may sync through your private Apple account. Profile preferences may use NSUbiquitousKeyValueStore. Reminder schedules and AI consent state remain local.</p>
              <p>Microphone, speech, camera, photo-library, and notification permissions are requested only for features you use. Purchases are handled by StoreKit. See the <a href="${sharedLinks.apple}" target="_blank" rel="noopener noreferrer">Apple Privacy Policy</a>.</p>`
          },
          {
            id: "storage", title: "5. Storage, retention, and security",
            html: `<p>Records are stored locally using SwiftData, UserDefaults, Application Support files, and the app-group container. Progress-photo originals and food photos are stored in Application Support; compressed copies, thumbnails, or cutouts may also be created. Apple Health steps, sleep, active energy, and workout summaries used by the activity and sleep screens are held temporarily for display and are not stored as LightYet records.</p>
              <p>Local records remain until deleted, cleared, or the app is uninstalled. iCloud copies remain until removed through LightYet or Apple controls. Service providers may retain limited request or operational data under their own policies.</p>
              <p>LightYet relies on iOS sandboxing, Apple Data Protection, HTTPS, CloudKit security, and provider access controls. No storage or transmission method is guaranteed to be completely secure. If you enable iCloud, a generated AI report may be included in the existing AI snapshot sync; the raw Apple Health activity data used to create it is not synced.</p>`
          },
          {
            id: "sharing", title: "6. Sharing, sale, analytics, and advertising",
            html: `<p>LightYet does not sell or rent personal information and currently includes no third-party advertising or behavioral analytics SDKs.</p>
              <p>Information is shared only with Apple for enabled Apple services, with Cloudflare and Xiaomi MiMo after AI consent and an AI request, with recipients you choose when exporting, or when required by valid law.</p>`
          },
          {
            id: "choices", title: "7. Your choices and controls",
            html: `<ul>
                <li>Use core tracking features without AI consent.</li>
                <li>Turn AI Data Sharing on or off in Settings.</li>
                <li>Manage camera, photos, microphone, speech, notifications, Health, and iCloud permissions in iOS. Apple Health permissions must be granted separately on each device.</li>
                <li>Edit or delete weight, food, photo, and AI conversation records.</li>
                <li>Export supported data, clear app data, and manage iCloud copies through Apple controls.</li>
              </ul>
              <p>Depending on your location, privacy laws may provide rights to access, correct, delete, or restrict processing. Contact the developer for questions about externally processed AI requests.</p>`
          },
          {
            id: "children", title: "8. Children's privacy",
            html: `<p>LightYet is not directed to children under 13 or the minimum age required in the user's jurisdiction. We do not knowingly collect information from children below the applicable minimum age.</p>`
          },
          {
            id: "changes", title: "9. Changes to this policy",
            html: `<p>This policy may be updated as LightYet changes. The effective date will be revised when the policy changes. Material changes to AI processing, providers, or user choices should also be reflected in app disclosures.</p>`
          },
          {
            id: "contact", title: "10. Contact",
            html: `<p>For privacy questions, requests, or concerns, contact the independent developer at <a href="mailto:sampson1993@zohomail.cn">sampson1993@zohomail.cn</a>.</p>`
          }
        ],
        footer: "© 2026 LightYet. This policy applies to the current LightYet iOS app."
      },

      zh: {
        title: "隐私政策",
        subtitle: "本政策说明 LightYet 如何处理体重管理数据、照片、Apple 健康数据、可选 iCloud 同步，以及提交给 AI 功能的信息。",
        meta: ["生效日期：2026 年 8 月 25 日", "本地优先", "AI 共享需要同意"],
        nav: ["概览", "信息", "AI 处理", "Apple 服务", "存储", "你的选择", "联系"],
        summaryTitle: "隐私概览",
        summary: "LightYet 是一款本地优先的体重管理应用。核心记录保存在你的设备上。你选择使用时，部分功能可能使用 Apple iCloud、Apple 健康、本地通知、语音识别、相机、照片图库、StoreKit 和外部 AI 处理。",
        cards: [
          ["无广告或行为追踪", "当前版本不包含第三方广告或行为分析 SDK。"],
          ["AI 是可选功能", "在你同意 AI 数据共享之前，不会发送任何 AI 请求。"],
          ["健康数据需要授权", "只有在你授予相应 iOS 权限后，应用才会读取或写入 Apple 健康数据。步数、睡眠、活动能量和训练摘要默认仅保留在本设备。"],
          ["iCloud 同步可选", "只有开启后，支持的记录才会通过你的 Apple iCloud 账户同步；默认关闭。"]
        ],
        sections: [
          {
            id: "information", title: "1. LightYet 处理的信息",
            html: `<p>应用处理的信息取决于你选择使用的功能，可能包括：</p>
              <ul>
                <li>体重、体脂率、时间、备注、目标和趋势摘要。</li>
                <li>昵称、年龄、性别选择、身高、目标体重、头像、单位和主题。</li>
                <li>进度照片、缩略图、姿势标签、饮食记录、餐食照片和热量估算。</li>

                <li>提醒偏好、购买权益状态，以及你授权后的 Apple 健康体重、体脂、身高、步数、睡眠、活动能量或训练摘要数据。</li>
              </ul>
              <h3>设备和网络信息</h3>
              <p>Apple 和 AI 服务在网络通信时会自然接收到 IP 地址、请求时间和技术请求头等常规信息。LightYet 不会用这些信息建立广告画像或进行跨应用追踪。</p>
              <p>当前版本不会请求通讯录、精确位置、银行卡资料或广告标识符。支付资料由 Apple 处理。</p>`
          },
          {
            id: "use", title: "2. 信息的使用方式",
            html: `<ul>
                <li>创建、展示、搜索、导入、导出和删除记录。</li>
                <li>计算趋势、成就、热量总计、摘要和小组件数据。</li>
                <li>保存你选择的照片，并提供你开启的提醒、Apple 健康和 iCloud 功能。</li>
                <li>通过 StoreKit 验证高级版权益。</li>
                <li>在你授权后，提供你主动请求的 AI 结果。</li>
              </ul>
              <p>LightYet 不会将信息用于行为广告、数据交易或跨应用追踪。</p>`
          },
          {
            id: "ai", title: "3. AI 数据共享与外部处理",
            html: `<div class="notice"><strong>AI 功能需要主动同意。</strong><p>发送任何 AI 请求前，LightYet 会显示 AI 数据共享说明。你可以拒绝并继续使用非 AI 功能，也可以随时在设置中撤回同意。</p></div>
              <p>AI 请求会经过托管在 <strong>Cloudflare Workers</strong> 上的 LightYet 网关，并转发给 <strong>Xiaomi MiMo</strong>。</p>
              <h3>可能发送的数据</h3>
              <ul>
                <li><strong>餐食照片估算：</strong>你选择的压缩餐食图片、可选提示、语言地区和热量目标。</li>

                <li><strong>AI 健康问答：</strong>你的问题、近期对话上下文，以及相关年龄、性别选择、身高、体重、体脂、趋势和热量信息。</li>
                <li><strong>AI 身体复盘：</strong>相关个人资料、计划偏好、体重和体脂趋势、热量摘要，以及你主动请求报告时提供的 Apple 健康步数、睡眠时长汇总、活动能量总量和训练摘要。</li>
              </ul>
              <p>身体复盘不会发送进度照片。用于身体复盘的 Apple 健康活动数据只会为本次报告临时读取；LightYet 不会将这些原始数值保存为应用记录，也不会通过 iCloud 同步。只有当你主动选择餐食照片进行 AI 估算时，该照片才会发送。AI 结果可能不准确，不构成医疗诊断、治疗或急救建议。</p>

              </ul>`
          },
          {
            id: "apple", title: "4. Apple 服务",
            html: `<h3>Apple 健康</h3>
              <p>在你授权后，LightYet 可以读取体重和体脂记录；在你主动更新资料时读取身高；开启写入后将新的体重或体脂记录写入 Apple 健康。在活动与睡眠功能中，可能读取每日步数、睡眠时长汇总、活动能量总量和训练摘要。这四类活动数据是可选的，只有在你授予相应 iOS 健康权限后才会读取，也不会写回 Apple 健康。HealthKit 数据不会用于广告或追踪。活动数据默认仅在本设备读取和使用，不保存为 LightYet 应用记录，也不进入 iCloud 同步；只有在你同意 AI 数据共享并主动请求 AI 身体复盘时，相关数据才可能离开设备。每台设备都需要单独授权 Apple 健康。</p>
              <h3>iCloud 和其他 Apple 服务</h3>

              <p>麦克风、语音、相机、照片和通知权限只在使用相应功能时请求。购买由 StoreKit 处理。请参阅 <a href="${sharedLinks.apple}" target="_blank" rel="noopener noreferrer">Apple 隐私政策</a>。</p>`
          },

    function render(language) {
      const copy = translations[language] || translations.en;
      document.documentElement.lang = language;
      document.title = `${copy.title} - LightYet`;
      document.getElementById("pageTitle").textContent = copy.title;
      document.getElementById("subtitle").textContent = copy.subtitle;
      document.getElementById("meta").innerHTML = copy.meta
        .map(item => `<span class="pill">${item}</span>`).join("");

      const navTargets = ["overview", "information", "ai", "apple", "storage", "choices", "contact"];
      document.getElementById("navLinks").innerHTML = copy.nav
        .map((label, index) => `<a href="#${navTargets[index]}">${label}</a>`).join("");
      document.getElementById("navigation").setAttribute("aria-label", copy.title);

      const cards = copy.cards.map(card => `
        <div class="data-card">
          <strong>${card[0]}</strong>
          <span>${card[1]}</span>
        </div>
      `).join("");

      const sections = copy.sections.map(section => `
        <section id="${section.id}">
          <h2>${section.title}</h2>
          ${section.html}
        </section>
      `).join("");

      document.getElementById("content").innerHTML = `
        <div class="summary" id="overview">
          <h2>${copy.summaryTitle}</h2>
          <p>${copy.summary}</p>
          <div class="data-grid">${cards}</div>
        </div>
        ${sections}
      `;
      document.getElementById("footer").innerHTML = `<p>${copy.footer}</p>`;

      document.querySelectorAll("[data-lang]").forEach(button => {
        button.classList.toggle("active", button.dataset.lang === language);
      });
      localStorage.setItem("lightyet_privacy_language", language);
    }

    function initialLanguage() {
      const saved = localStorage.getItem("lightyet_privacy_language");
      if (saved && translations[saved]) return saved;
      const preferred = (navigator.language || "en").toLowerCase();
      return Object.keys(translations).find(language => preferred.startsWith(language)) || "en";
    }

    document.getElementById("languageSwitcher").addEventListener("click", event => {
      const button = event.target.closest("button[data-lang]");
      if (button) render(button.dataset.lang);
    });

    render(initialLanguage());
  </script>
