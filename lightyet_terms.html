<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Terms of Use for the LightYet iOS app.">
  <title>Terms of Use - LightYet</title>
  <style>
    :root {
      --bg: #f4fbf8;
      --card: #ffffff;
      --text: #17251f;
      --muted: #587067;
      --primary: #087b69;
      --primary-dark: #045d50;
      --soft: #e2f5ee;
      --border: #cae6dc;
      --warning: #fff6dd;
      --warning-border: #ead69a;
      --shadow: 0 18px 55px rgba(4, 93, 80, 0.09);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--bg); }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 85% 5%, rgba(8, 123, 105, 0.12), transparent 30rem),
        var(--bg);
      font-size: 16px;
      line-height: 1.72;
    }

    a { color: var(--primary-dark); font-weight: 650; }
    header {
      color: white;
      background: linear-gradient(135deg, #034c43, #0a8a74);
      padding: 24px 24px 54px;
    }

    .header-inner,
    main,
    footer {
      width: min(880px, calc(100% - 40px));
      margin: 0 auto;
    }

    .top-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 30px;
    }

    .language-switcher {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 5px;
      padding: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 15px;
      background: rgba(255,255,255,0.1);
    }

    .language-switcher button {
      border: 0;
      border-radius: 999px;
      padding: 7px 10px;
      color: rgba(255,255,255,0.82);
      background: transparent;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 750;
      cursor: pointer;
    }

    .language-switcher button.active {
      color: #034c43;
      background: white;
    }

    .eyebrow {
      margin: 0 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.78rem;
      font-weight: 750;
      opacity: 0.78;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.3rem, 8vw, 4.2rem);
      line-height: 1.05;
      letter-spacing: -0.045em;
    }

    .subtitle {
      max-width: 700px;
      margin: 18px 0 0;
      font-size: 1.08rem;
      color: rgba(255,255,255,0.88);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .pill {
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 999px;
      background: rgba(255,255,255,0.11);
      font-size: 0.82rem;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      overflow-x: auto;
      white-space: nowrap;
      background: color-mix(in srgb, var(--card) 94%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
    }

    nav div {
      width: min(920px, 100%);
      margin: 0 auto;
      padding: 0 18px;
    }

    nav a {
      display: inline-block;
      padding: 14px 12px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.86rem;
    }

    main { padding: 46px 0 76px; }

    .summary,
    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .summary {
      padding: 26px;
      margin-bottom: 24px;
      background: linear-gradient(145deg, var(--card), var(--soft));
    }

    section {
      padding: clamp(22px, 5vw, 34px);
      margin-top: 20px;
      scroll-margin-top: 72px;
    }

    h2 {
      margin: 0 0 15px;
      font-size: 1.45rem;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    h3 { margin: 24px 0 8px; font-size: 1.05rem; }
    p { margin: 11px 0; color: var(--muted); }
    strong { color: var(--text); }
    ul { margin: 12px 0; padding-left: 1.25rem; }
    li { margin: 8px 0; color: var(--muted); }

    .notice {
      margin: 18px 0;
      padding: 16px 18px;
      border: 1px solid var(--warning-border);
      border-radius: 15px;
      background: var(--warning);
      color: #58491c;
    }

    .notice p { color: inherit; margin: 6px 0 0; }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 18px 0;
    }

    .data-card {
      padding: 16px;
      border-radius: 15px;
      background: var(--soft);
      border: 1px solid var(--border);
    }

    .data-card strong { display: block; margin-bottom: 4px; }
    .data-card span { color: var(--muted); font-size: 0.92rem; }

    footer {
      padding: 0 0 48px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
    }

    @media (max-width: 650px) {
      header { padding: 16px 14px 44px; }
      .header-inner, main, footer { width: min(100% - 28px, 880px); }
      .top-row { margin-bottom: 28px; }
      .language-switcher { justify-content: center; }
      .data-grid { grid-template-columns: 1fr; }
      section, .summary { border-radius: 18px; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09120f;
        --card: #101c18;
        --text: #e7f3ee;
        --muted: #adc2ba;
        --primary: #67d5bd;
        --primary-dark: #86e6d0;
        --soft: #142a23;
        --border: #29483e;
        --warning: #302a17;
        --warning-border: #655626;
        --shadow: none;
      }
    }
  </style>
</head>

      <h1 id="pageTitle"></h1>

      <div class="meta" id="meta"></div>
    </div>
  </header>

  <main id="content"></main>

    function render(language) {

          <h2>${section.title}</h2>
          ${section.html}
        </section>
      `).join("");

      document.getElementById("content").innerHTML = `
        <div class="summary" id="overview">
          <h2>${copy.summaryTitle}</h2>
          <p>${copy.summary}</p>
          <div class="data-grid">${cards}</div>
        </div>
        ${sections}
      `;
      document.getElementById("footer").innerHTML = `<p>${copy.footer}</p>`;

      document.querySelectorAll("[data-lang]").forEach(button => {
        button.classList.toggle("active", button.dataset.lang === language);
      });
      localStorage.setItem("lightyet_terms_language", language);
    }

    function initialLanguage() {
      const saved = localStorage.getItem("lightyet_terms_language");
      if (saved && translations[saved]) return saved;
      const preferred = (navigator.language || "en").toLowerCase();
      return Object.keys(translations).find(language => preferred.startsWith(language)) || "en";
    }

    document.getElementById("languageSwitcher").addEventListener("click", event => {
      const button = event.target.closest("button[data-lang]");
      if (button) render(button.dataset.lang);
    });

    render(initialLanguage());
  </script>
</body>
</html>
